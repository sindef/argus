{{define "content"}}
<form method="post" action="/password" class="card form" style="max-width:440px;margin:40px auto">
  <h1>Change password</h1>
  {{if .Session.MustChange}}<p class="muted">Set a new password to continue.</p>{{end}}
  {{with .Error}}<p class="error">{{.}}</p>{{end}}
  <label class="field">Current password <input name="current" type="password" autocomplete="current-password" required autofocus></label>
  <label class="field">New password <input name="password" type="password" minlength="12" autocomplete="new-password" required></label>
  <label class="field">Confirm <input name="confirm" type="password" minlength="12" autocomplete="new-password" required></label>
  <button class="btn primary" type="submit">Change password</button>
</form>
{{end}}
