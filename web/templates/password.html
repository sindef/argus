{{define "content"}}
<form method="post" action="/password" class="card narrow">
  <h1>Change password</h1>
  {{if .Session.MustChange}}<p class="muted">Set a new password to continue.</p>{{end}}
  {{with .Error}}<p class="error">{{.}}</p>{{end}}
  <label>Current password <input name="current" type="password" autocomplete="current-password" required autofocus></label>
  <label>New password <input name="password" type="password" minlength="12" autocomplete="new-password" required></label>
  <label>Confirm <input name="confirm" type="password" minlength="12" autocomplete="new-password" required></label>
  <button type="submit">Change</button>
</form>
{{end}}
