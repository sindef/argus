{{define "content"}}
<div class="page-head">
  <svg class="i i-lg"><use href="/static/vendor/lucide/icons.svg#i-server"/></svg>
  <div><h1>{{.Host}}</h1><div class="crumbs">{{with .Node.Datacenter}}{{.}} / {{end}}{{with .Node.Cluster}}{{.}} / {{end}}{{.Host}}</div></div>
</div>
<div class="panes static wide">
<nav class="panes-nav">{{range .Tabs}}<a href="/hosts/{{$.Host}}/{{.Path}}"{{if eq $.Tab .Path}} class="active"{{end}}>{{template "icon" .Icon}}{{.Label}}</a>{{end}}</nav>
<div class="panes-body remote">{{.Body}}</div>
</div>
{{end}}
