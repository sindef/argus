{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>argus</title>
<link rel="stylesheet" href="/static/argus.css">
<script src="/static/vendor/htmx/htmx.min.js"></script>
</head>
<body>
<header>
  <nav>
    <a class="brand" href="/">argus</a>
    {{with .Session}}{{if and .User (not .MustChange)}}
    <a href="/">Virtual machines</a>
    <a href="/images">Images</a>
    {{if eq .Role "admin"}}<a href="/users">Users</a>{{end}}
    {{end}}{{end}}
  </nav>
  {{with .Session}}{{if .User}}
  <form method="post" action="/logout" class="user">
    <a href="/password">{{.User}}</a>
    <button type="submit" class="link">Log out</button>
  </form>
  {{end}}{{end}}
</header>
<main>{{template "content" .}}</main>
</body>
</html>{{end}}
