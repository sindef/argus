{{define "content"}}
<div class="page-head">
  <svg class="i i-lg"><use href="/static/vendor/lucide/icons.svg#i-users"/></svg>
  <div><h1>Users</h1></div>
</div>
{{with .Error}}<p class="error">{{.}}</p>{{end}}
{{with .Notice}}<p class="notice">{{.}}</p>{{end}}
<div class="table-wrap">
<table>
  <thead><tr><th>Name</th><th>Role</th><th></th></tr></thead>
  <tbody>
  {{range .Users}}
  <tr>
    <td>{{template "icon" "user"}}{{.Name}}{{if .MustChange}} <span class="muted">(password change pending)</span>{{end}}</td>
    <td>
      <form method="post" action="/users/{{.Name}}/role">
        <select name="role" onchange="this.form.submit()">
          {{$r := .Role}}{{range $.Roles}}<option value="{{.}}"{{if eq . $r}} selected{{end}}>{{.}}</option>{{end}}
        </select>
      </form>
    </td>
    <td class="row-actions">
      {{if ne .Name $.Session.User}}
      <form method="post" action="/users/{{.Name}}/reset"><button type="submit" class="link">Reset password</button></form>
      <form method="post" action="/users/{{.Name}}/delete" onsubmit="return confirm('Delete {{.Name}}?')"><button type="submit" class="link danger">Delete</button></form>
      {{end}}
    </td>
  </tr>
  {{end}}
  </tbody>
</table>
</div>
<form method="post" action="/users" class="inline spaced">
  <input name="name" placeholder="username" pattern="[a-z][a-z0-9._-]{0,31}" required>
  <select name="role">{{range .Roles}}<option value="{{.}}"{{if eq . "read-only"}} selected{{end}}>{{.}}</option>{{end}}</select>
  <button class="btn primary" type="submit">{{template "icon" "plus"}}Add user</button>
</form>
{{end}}
