name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned TruffleHog
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.99.2/trufflehog_3.99.2_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/trufflehog.tar.gz"
          echo "3c7b0d1dc4278294269bfdd7594bca8bb28c78da0a4a06ad202ded37b48deca4  $RUNNER_TEMP/trufflehog.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trufflehog.tar.gz" -C "$RUNNER_TEMP" trufflehog
      - name: Scan full Git history
        run: |
          "$RUNNER_TEMP/trufflehog" git "file://$PWD" \
            --no-verification --no-update --fail --fail-on-scan-errors --github-actions
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.2"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...
      - run: go test -race ./...
      - run: go build ./...
      - run: make notices-check
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: for f in os/rootfs/usr/sbin/*; do sh -n "$f"; done
      - run: for f in scripts/*.sh os/third-party-*.sh; do sh -n "$f"; done
  images:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    needs: [check, secrets]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: docker buildx build -t argus:ci .
      - run: docker buildx build --build-arg CMD=argus-manager -t argus-manager:ci .
      - run: docker buildx build --build-arg CMD=argus-hostd --target bin --output type=local,dest=os/build .
