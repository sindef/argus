name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tagged commit on master
        run: |
          set -eu
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Make room for source archives
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet
      - name: Publish matching sources before images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          V="${GITHUB_REF_NAME#v}"
          make source-bundle VERSION="$V"
          git archive --format=tar.gz --output="build/argus-source-$V.tar.gz" "$GITHUB_SHA"
          manifest="build/argus-source-manifest-$V.sha256"
          sha256sum "build/argus-source-$V.tar.gz" build/third-party-sources/SHA256SUMS > "$manifest"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/release-source-check"
            gh release download "$GITHUB_REF_NAME" --pattern "${manifest#build/}" --dir "$RUNNER_TEMP/release-source-check"
            cmp "$manifest" "$RUNNER_TEMP/release-source-check/${manifest#build/}"
            gh release upload "$GITHUB_REF_NAME" --clobber "$manifest" \
              "build/argus-source-$V.tar.gz" build/argus-third-party-sources-"$V".tar.gz*
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Argus $V" \
              --notes 'Matching Argus source, build scripts, third-party source packages and license notices.' \
              "build/argus-source-$V.tar.gz" build/argus-third-party-sources-"$V".tar.gz* "$manifest"
          fi
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Build, attest and sign
        run: |
          set -eu
          V="${GITHUB_REF_NAME#v}"
          build() {
            docker buildx build --push --sbom=true --provenance=mode=max --metadata-file "$1.json" -t "$REGISTRY/$1:$V" "${@:2}"
            cosign sign --yes "$REGISTRY/$1@$(jq -r '."containerimage.digest"' "$1.json")"
          }
          build argus .
          build argus-manager --build-arg CMD=argus-manager .
          build argus-os --build-arg VERSION="$V" os
