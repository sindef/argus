name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  prepare:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tagged commit on master
        run: |
          set -eu
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: Publish matching source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          V="${GITHUB_REF_NAME#v}"
          mkdir -p build
          git archive --format=tar.gz --output="build/argus-source-$V.tar.gz" "$GITHUB_SHA"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber "build/argus-source-$V.tar.gz"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Argus $V" \
              --notes 'Matching Argus source, build scripts, third-party source packages and license notices.' \
              "build/argus-source-$V.tar.gz"
          fi
  os:
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Make room for source archives
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet
      - name: Publish matching third-party sources before images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          V="${GITHUB_REF_NAME#v}"
          make source-bundle VERSION="$V" ARCH="$ARCH"
          manifest="build/argus-source-manifest-$V-$ARCH.sha256"
          sha256sum "build/third-party-sources-$ARCH/SHA256SUMS" > "$manifest"
          if gh release download "$GITHUB_REF_NAME" --pattern "${manifest#build/}" --dir "$RUNNER_TEMP/release-source-check" 2>/dev/null; then
            cmp "$manifest" "$RUNNER_TEMP/release-source-check/${manifest#build/}"
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber "$manifest" build/argus-third-party-sources-"$V"-"$ARCH".tar.gz*
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Build, attest and sign the OS image
        run: |
          set -eu
          V="${GITHUB_REF_NAME#v}"
          docker buildx build --push --platform "linux/$ARCH" --sbom=true --provenance=mode=max --metadata-file os.json \
            --build-arg VERSION="$V" -t "$REGISTRY/argus-os:$V-$ARCH" os
          cosign sign --yes "$REGISTRY/argus-os@$(jq -r '."containerimage.digest"' os.json)"
  release:
    needs: os
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Build, attest and sign
        run: |
          set -eu
          V="${GITHUB_REF_NAME#v}"
          build() {
            docker buildx build --push --platform linux/amd64,linux/arm64 --sbom=true --provenance=mode=max --metadata-file "$1.json" -t "$REGISTRY/$1:$V" "${@:2}"
            cosign sign --yes "$REGISTRY/$1@$(jq -r '."containerimage.digest"' "$1.json")"
          }
          build argus .
          build argus-manager --build-arg CMD=argus-manager .
          docker buildx imagetools create -t "$REGISTRY/argus-os:$V" "$REGISTRY/argus-os:$V-amd64" "$REGISTRY/argus-os:$V-arm64"
          cosign sign --yes "$REGISTRY/argus-os@$(docker buildx imagetools inspect "$REGISTRY/argus-os:$V" --format '{{json .Manifest}}' | jq -r .digest)"
