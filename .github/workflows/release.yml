name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  prepare:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tagged commit on master
        run: |
          set -eu
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: Stage matching source in a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          V="${GITHUB_REF_NAME#v}"
          prerelease=false
          if [[ "$V" == *-* ]]; then prerelease=true; fi
          mkdir -p build
          git archive --format=tar.gz --output="build/argus-source-$V.tar.gz" "$GITHUB_SHA"
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            test "$draft" = true
            gh release upload "$GITHUB_REF_NAME" --clobber "build/argus-source-$V.tar.gz"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease="$prerelease" --title "Argus $V" \
              --notes 'Argus hypervisor and Manager. Includes AMD64 and ARM64 installation ISOs, signed OCI images, signed SHA-256 checksums, matching source archives and third-party license notices.' \
              "build/argus-source-$V.tar.gz"
          fi
  os:
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Make room for source archives
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          docker system prune -af
          df -h /
      - name: Stage matching third-party sources before images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          V="${GITHUB_REF_NAME#v}"
          make source-bundle VERSION="$V" ARCH="$ARCH"
          manifest="build/argus-source-manifest-$V-$ARCH.sha256"
          sha256sum "build/third-party-sources-$ARCH/SHA256SUMS" > "$manifest"
          if gh release download "$GITHUB_REF_NAME" --pattern "${manifest#build/}" --dir "$RUNNER_TEMP/release-source-check" 2>/dev/null; then
            cmp "$manifest" "$RUNNER_TEMP/release-source-check/${manifest#build/}"
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber "$manifest" build/argus-third-party-sources-"$V"-"$ARCH".tar.gz*
          sudo rm -rf "build/third-party-sources-$ARCH"
          rm -f build/argus-third-party-sources-"$V"-"$ARCH".tar.gz*
      - name: Build and stage the installation ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          V="${GITHUB_REF_NAME#v}"
          make iso VERSION="$V" ARCH="$ARCH"
          iso="build/argus-$V-$ARCH.iso"
          if [ "$(stat -c %s "$iso")" -ge 2147483648 ]; then
            gzip -n "$iso"
            iso="$iso.gz"
          fi
          test "$(stat -c %s "$iso")" -lt 2147483648
          checksum="argus-$V-$ARCH.sha256"
          (cd build && sha256sum "${iso#build/}" > "$checksum")
          gh release upload "$GITHUB_REF_NAME" --clobber "$iso" "build/$checksum"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v3.1.3
      - name: Build, attest and sign the OS image
        run: |
          set -eu
          V="${GITHUB_REF_NAME#v}"
          docker buildx build --push --platform "linux/$ARCH" --sbom=true --provenance=mode=max --metadata-file os.json \
            --build-arg VERSION="$V" --build-arg NOTICES=full -t "$REGISTRY/argus-os:$V-$ARCH" os
          cosign sign --yes "$REGISTRY/argus-os@$(jq -r '."containerimage.digest"' os.json)"
  release:
    needs: os
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v3.1.3
      - name: Build, attest and sign
        run: |
          set -eu
          V="${GITHUB_REF_NAME#v}"
          build() {
            docker buildx build --push --platform linux/amd64,linux/arm64 --sbom=true --provenance=mode=max --metadata-file "$1.json" -t "$REGISTRY/$1:$V" "${@:2}"
            cosign sign --yes "$REGISTRY/$1@$(jq -r '."containerimage.digest"' "$1.json")"
          }
          build argus .
          build argus-manager --build-arg CMD=argus-manager .
          docker buildx imagetools create -t "$REGISTRY/argus-os:$V" "$REGISTRY/argus-os:$V-amd64" "$REGISTRY/argus-os:$V-arm64"
          cosign sign --yes "$REGISTRY/argus-os@$(docker buildx imagetools inspect "$REGISTRY/argus-os:$V" --format '{{json .Manifest}}' | jq -r .digest)"
      - name: Verify and sign ISO checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          V="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --pattern "argus-$V-*.iso*" --pattern "argus-$V-*.sha256" --dir build/verify
          for arch in amd64 arm64; do
            checksum="argus-$V-$arch.sha256"
            test -s "build/verify/$checksum"
            (cd build/verify && sha256sum --check "$checksum")
          done
          cat "build/verify/argus-$V-amd64.sha256" "build/verify/argus-$V-arm64.sha256" > build/SHA256SUMS
          cosign sign-blob --yes --bundle build/SHA256SUMS.sigstore.json build/SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" --clobber build/SHA256SUMS build/SHA256SUMS.sigstore.json
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false
          fi
