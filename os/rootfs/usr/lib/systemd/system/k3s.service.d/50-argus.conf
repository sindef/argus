[Unit]
Requires=argus-datastore.service
After=argus-datastore.service

[Service]
Environment=K3S_CONFIG_FILE=/usr/share/argus/k3s.yaml
Environment=GOMEMLIMIT=1GiB
Environment=GOGC=50
ExecStartPre=/bin/sh -c 'mkdir -p /var/lib/rancher/k3s/server/manifests /var/lib/rancher/k3s/agent/images && cp -f /usr/share/argus/manifests/*.yaml /var/lib/rancher/k3s/server/manifests/ && cp -f /usr/share/argus/images/*.tar /var/lib/rancher/k3s/agent/images/'
ExecStartPre=-/bin/sh -c 'for b in /sys/class/net/*/bridge; do d=$${b%%/bridge}; [ "$$(cat $$d/addr_assign_type)" = 3 ] || [ -z "$$(ls $$d/brif)" ] || ip link set "$${d##*/}" address "$$(cat $$d/address)"; done'
