disable:
  - traefik
  - servicelb
  - metrics-server
  - local-storage
disable-cloud-controller: true
disable-network-policy: true
flannel-backend: host-gw
write-kubeconfig-mode: "0600"
kubelet-arg:
  - system-reserved=cpu=250m,memory=256Mi
  - kube-reserved=cpu=250m,memory=512Mi
nonroot-devices: true
