apiVersion: v1
kind: Namespace
metadata:
  name: argus-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argus
  namespace: argus-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argus
rules:
  - apiGroups: [kubevirt.io]
    resources: [virtualmachines]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [kubevirt.io]
    resources: [virtualmachineinstances]
    verbs: [get, list, watch]
  - apiGroups: [subresources.kubevirt.io]
    resources: [virtualmachines/start, virtualmachines/stop, virtualmachines/restart]
    verbs: [update]
  - apiGroups: [subresources.kubevirt.io]
    resources: [virtualmachineinstances/vnc, virtualmachineinstances/console]
    verbs: [get]
  - apiGroups: [subresources.kubevirt.io]
    resources: [virtualmachineinstances/pause, virtualmachineinstances/unpause, virtualmachineinstances/freeze, virtualmachineinstances/unfreeze]
    verbs: [update]
  - apiGroups: [clone.kubevirt.io]
    resources: [virtualmachineclones]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [list]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, patch]
  - apiGroups: [zfs.openebs.io]
    resources: [zfsnodes, zfssnapshots]
    verbs: [list]
  - apiGroups: [zfs.openebs.io]
    resources: [zfsvolumes]
    verbs: [get, list, delete]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, create, delete]
  - apiGroups: [cdi.kubevirt.io]
    resources: [storageprofiles]
    verbs: [get, create, update]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots]
    verbs: [get, list, create, delete]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotcontents]
    verbs: [get]
  - apiGroups: [cdi.kubevirt.io]
    resources: [datavolumes]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [cdi.kubevirt.io]
    resources: [datavolumes/source]
    verbs: [create]
  - apiGroups: [upload.cdi.kubevirt.io]
    resources: [uploadtokenrequests]
    verbs: [create]
  - apiGroups: [snapshot.kubevirt.io]
    resources: [virtualmachinesnapshots]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [snapshot.kubevirt.io]
    resources: [virtualmachinerestores]
    verbs: [create]
  - apiGroups: [kubevirt.io]
    resources: [virtualmachineinstancemigrations]
    verbs: [get, list, create, delete, deletecollection]
  - apiGroups: [kubevirt.io]
    resources: [kubevirts]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: [cdi.kubevirt.io]
    resources: [cdis]
    verbs: [get, list]
  - apiGroups: [export.kubevirt.io]
    resources: [virtualmachineexports]
    verbs: [get, list, create, delete]
  - apiGroups: [k8s.cni.cncf.io]
    resources: [network-attachment-definitions]
    verbs: [get, list, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argus
subjects:
  - kind: ServiceAccount
    name: argus
    namespace: argus-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argus
  namespace: argus-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argus
  namespace: default
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argus
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argus
subjects:
  - kind: ServiceAccount
    name: argus
    namespace: argus-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argus
  namespace: kubevirt
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, deletecollection]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [virt-synchronization-controller]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argus
  namespace: kubevirt
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argus
subjects:
  - kind: ServiceAccount
    name: argus
    namespace: argus-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argus
  namespace: cdi
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [cdi-uploadproxy-signer-bundle]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argus
  namespace: cdi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argus
subjects:
  - kind: ServiceAccount
    name: argus
    namespace: argus-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argus
  namespace: argus-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argus
subjects:
  - kind: ServiceAccount
    name: argus
    namespace: argus-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus
  namespace: argus-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: argus
  template:
    metadata:
      labels:
        app: argus
    spec:
      serviceAccountName: argus
      containers:
        - name: argus
          image: argus:VERSION
          imagePullPolicy: Never
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ARGUS_RUN_DIR
              value: /host/run/argus
            - name: ARGUS_RELEASE_FILE
              value: /host/etc/kairos-release
            - name: ARGUS_ADMIN_PASSWORD_FILE
              value: /host/etc/argus/admin-password
            - name: GOMEMLIMIT
              value: 200MiB
            - name: ARGUS_SCRATCH
              value: /scratch
          ports:
            - containerPort: 8443
              hostPort: 443
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: run
              mountPath: /host/run/argus
            - name: etc
              mountPath: /host/etc/argus
              readOnly: true
            - name: release
              mountPath: /host/etc/kairos-release
              readOnly: true
            - name: scratch
              mountPath: /scratch
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 2Gi
        - name: run
          hostPath:
            path: /run/argus
            type: Directory
        - name: etc
          hostPath:
            path: /etc/argus
            type: DirectoryOrCreate
        - name: release
          hostPath:
            path: /etc/kairos-release
            type: File
