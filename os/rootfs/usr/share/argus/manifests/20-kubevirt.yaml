apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  infra:
    replicas: 1
  workloadUpdateStrategy:
    workloadUpdateMethods: []
  configuration:
    vmRolloutStrategy: LiveUpdate
    developerConfiguration:
      featureGates:
        - DecentralizedLiveMigration
        - DeclarativeHotplugVolumes
    virtTemplateDeployment:
      enabled: false
    virtualMachineOptions:
      disableSerialConsoleLog: {}
  customizeComponents:
    patches:
      - resourceType: Deployment
        resourceName: virt-api
        type: strategic
        patch: '{"spec":{"template":{"spec":{"containers":[{"name":"virt-api","env":[{"name":"GOGC","value":"50"}],"resources":{"requests":{"memory":"180Mi"}}}]}}}}'
      - resourceType: Deployment
        resourceName: virt-controller
        type: strategic
        patch: '{"spec":{"template":{"spec":{"containers":[{"name":"virt-controller","env":[{"name":"GOGC","value":"50"}],"resources":{"requests":{"memory":"100Mi"}}}]}}}}'
      - resourceType: Deployment
        resourceName: virt-exportproxy
        type: strategic
        patch: '{"spec":{"template":{"spec":{"containers":[{"name":"exportproxy","env":[{"name":"GOGC","value":"50"}],"resources":{"requests":{"memory":"40Mi"}}}]}}}}'
      - resourceType: DaemonSet
        resourceName: virt-handler
        type: strategic
        patch: '{"spec":{"template":{"spec":{"containers":[{"name":"virt-handler","env":[{"name":"GOGC","value":"50"}],"resources":{"requests":{"memory":"100Mi"}}}]}}}}'
      - resourceType: Deployment
        resourceName: virt-synchronization-controller
        type: strategic
        patch: '{"spec":{"template":{"spec":{"containers":[{"name":"sync","env":[{"name":"GOGC","value":"50"}]}]}}}}'
